<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada · Advocacia Smart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;800&family=Space+Mono:wght@700&display=swap">
<style>
:root{--bg:#070908;--ink:#f3f7f4;--muted:#97a69e;--green:#2df58e;--green-ink:#04170c;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Montserrat",system-ui,sans-serif;text-align:center;padding:24px}
.k{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:2px;color:var(--green)}
h1{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:clamp(48px,10vw,110px);line-height:.92;text-transform:uppercase;margin:12px 0}
p{color:var(--muted);margin:0 0 28px}
a{display:inline-block;background:var(--green);color:var(--green-ink);font-weight:800;text-decoration:none;padding:14px 26px;border-radius:999px}
</style>
</head>
<body>
<div><div class="k">ERRO 404 · CPC, ART. 485</div><h1>Episódio não encontrado</h1><p>Esse endereço não existe ou mudou de lugar.</p><a id="home" href="./">Voltar ao catálogo</a></div>
<script>
// aponta para a raiz do site, funcione em usuario.github.io/repo/ ou num domínio próprio
var p=location.pathname.split('/').filter(Boolean);
document.getElementById('home').href = location.hostname.endsWith('github.io') && p.length ? '/'+p[0]+'/' : '/';
</script>
</body>
</html>
